<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Call script · Nuria (Pennylane)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&display=swap">
<style>
:root{--bg:#eef1f5;--sf:#fff;--tx:#0f1a2b;--mu:#5d6b80;--bd:#d5dce6;--ac:#2f4bff;--ac2:#e8ecff;--ok:#0e7a52;--ok2:#dff5ec;--wa:#a35a00;--wa2:#fff0d9;--cl:#4a5b73;--cl2:#e6eaf0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d121b;--sf:#161d2a;--tx:#e8edf5;--mu:#93a1b6;--bd:#2a3445;--ac:#7f95ff;--ac2:#202a52;--ok:#4fd1a0;--ok2:#12372b;--wa:#f0b352;--wa2:#3a2a10;--cl:#a9b6c9;--cl2:#232c3b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d121b;--sf:#161d2a;--tx:#e8edf5;--mu:#93a1b6;--bd:#2a3445;--ac:#7f95ff;--ac2:#202a52;--ok:#4fd1a0;--ok2:#12372b;--wa:#f0b352;--wa2:#3a2a10;--cl:#a9b6c9;--cl2:#232c3b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:10}
h1,.say{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--sf);border-bottom:1px solid var(--bd);padding:10px 16px}
.w{max-width:820px;margin:auto}
header h1{font-size:20px}
nav{display:flex;gap:6px;margin-top:8px}
nav button{flex:1;padding:10px 6px;font-weight:600}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:8px;padding:8px 12px}
button[aria-pressed="true"],nav button[aria-current="true"]{background:var(--ac);color:#fff;border-color:var(--ac)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button[aria-pressed="true"],:root:not([data-theme="light"]) nav button[aria-current="true"]{color:#0d121b}}
:root[data-theme="dark"] button[aria-pressed="true"],:root[data-theme="dark"] nav button[aria-current="true"]{color:#0d121b}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:1px}
main{max-width:820px;margin:auto;padding:16px}
section{display:none}section.on{display:block}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.say{font-size:19px;line-height:1.35;font-weight:500}
.mu{color:var(--mu);font-size:14px}
.k{border:1px solid var(--ok);background:var(--ok2)}
.k small{display:block;color:var(--mu);font-size:13px;margin-top:2px;font-family:system-ui,sans-serif}
input[type=text]{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
label{display:block;font-size:14px;color:var(--mu);margin:8px 0 4px}
.tg{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd);margin:0;color:var(--tx);font-size:17px}
.tg:last-child{border:0}
input[type=checkbox]{width:24px;height:24px;flex:none}
.v{padding:14px 16px;border-radius:12px;font-weight:700;font-size:18px;margin-bottom:8px}
.v.go{background:var(--ok2);color:var(--ok)}.v.fix{background:var(--wa2);color:var(--wa)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.grp{font-size:13px;font-weight:700;margin:10px 0 0}
.grp.w1{color:var(--ok)}.grp.w2{color:var(--wa)}.grp.w3{color:var(--cl)}
.chips.w1 button{border-color:var(--ok)}.chips.w2 button{border-color:var(--wa)}.chips.w3 button{border-color:var(--cl)}
pre{white-space:pre-wrap;font:inherit;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:12px;margin:8px 0}
.tip{background:var(--wa2);border-left:4px solid var(--wa);padding:8px 12px;border-radius:6px;font-size:14px;margin-top:8px}
.st{border-left:4px solid var(--ac);padding-left:12px;margin:12px 0}
.st b{display:block;font-size:13px;color:var(--mu);font-weight:600}
.st.then{border-color:var(--ok)}
b.l{display:block;font-size:13px;color:var(--mu);font-weight:600;margin-top:8px}
.f{font-size:14px;color:var(--mu);margin-top:14px}
nav button{font-size:14px;padding:10px 2px}.tm{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:1px 9px;background:var(--ac2);color:var(--ac);margin-right:8px}.ln{margin:10px 0}.ln b{display:block;font-size:12px;color:var(--mu)}.ln .say{font-size:17px}.br{border:1px solid var(--bd);border-radius:10px;padding:8px 10px;margin:6px 0}.br .cue{font-size:13px;color:var(--wa);font-weight:700}.br .rep{font-size:15px}.hd2{font-weight:700;margin:16px 0 2px;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:17px;color:var(--ac)}.lis{font-size:14px;color:var(--mu);margin:4px 0}.lis b{color:var(--ok)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.why{background:var(--ok2);border:1px solid var(--ok);border-radius:10px;padding:10px 12px}.not{background:var(--cl2);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}.two b{display:block;font-size:13px;margin-bottom:2px}.why b{color:var(--ok)}.not b{color:var(--cl)}.two ul{margin:4px 0 0;padding-left:18px}@media (max-width:560px){.two{grid-template-columns:1fr}}
@media (max-width:520px){.say{font-size:18px}}
</style></head><body>
<header><div class="w"><h1>Call script · 20-minute discovery and sales call</h1></div></header>
<main>
<p class="mu" style="margin:0 0 6px">Prospect: Nuria, founder of a 3-person digital agency in Madrid. Uses Holded for invoicing, a bank portal and Excel for cash; her accountant uses A3. Tick each block once you have done it. <b id="cnt"></b></p>
<div id="scr"></div>
</main>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var C=[
["0:00–2:00","Opening","A clear opening that creates context and earns the right to ask questions.",[
["say","“Hi Nuria, I’m [name] from Pennylane. Thanks for making time.”"],
["say","“I saw you started your subscription and stopped when it asked you to connect your bank. That’s one of the most common places people pause, so there’s no pressure on this call.”"],
["say","“Here’s how I’d like to use the next 15 to 20 minutes: you tell me how invoicing and cash work in your agency today, I share what I see, and we decide together if Pennylane fits. If it doesn’t, I’ll tell you. We’ll finish with one clear next step. Is that okay?”"],
["lis","a clear yes before you ask anything else."],
["if",[["“I only have 10 minutes.”","“Then I’ll be quick: three questions, and we’ll agree the next step. What matters most to you?”"],["“I wasn’t sure about connecting my bank.”","“That’s exactly what I want to understand. I’ll come back to it in a few minutes, so I can answer with your situation in mind.”"]]]],
"Evidence: you referred to her own signup, asked permission, set the agenda and the time, and promised honesty."],

["2:00–11:00","Discovery","Discovery focused on the prospect’s current process, pain, impact, urgency, stakeholders and decision criteria.",[
["h","Current process · 2:00"],
["ask","“Walk me through what happens from the moment you send an invoice to knowing how much cash you have. Who does what, in which tool?”"],
["lis","Holded for invoicing, a separate bank portal, Excel for cash, her accountant on A3. Count the manual steps."],
["ask","“How often do you update the Excel, and who else touches it?”"],
["h","Pain · 4:00"],
["ask","“Which part of that is the most annoying?”"],
["ask","“When did it last cause a real problem?”"],
["note","Write her exact words. You will repeat them in the value proposition."],
["h","Impact · 5:30"],
["ask","“Roughly how many hours a week does that take, and who does it?”"],
["ask","“What happens when you can’t see your cash on time? Has it affected a payment, a decision or a client?”"],
["note","Turn it into a number: hours per week × the value of her hour. You’ll use it for price."],
["h","Urgency · 7:00"],
["ask","“Why look at this now? Did something change?”"],
["lis","a deadline, growth, a new hire, a cash surprise, her accountant asking for better data. If there is no trigger, a one-call close is less likely."],
["h","Stakeholders · 8:00"],
["ask","“Besides you, who needs to be comfortable with a change like this?”"],
["ask","“How does your accountant get your data today, and how would she feel about working from a shared space?”"],
["if",[["“Just me.”","Good sign for a one-call deal. Check it: “So you decide, and your accountant just needs to know?”"],["“I need to check with my accountant or partner.”","Don’t push. Ask: “What would they need to see to say yes?” You’ll offer a short summary or call at the close."]]],
["h","Decision criteria · 9:30"],
["ask","“What would need to be true for you to feel comfortable switching from your current setup?”"],
["ask","“Is there anything that would make this a no?”"],
["h","The drop-off · 10:30"],
["ask","“You paused at the bank step. What went through your mind?”"],
["if",[["Trust or security","Plan: connect together at the close. Mention ISO 27001 and European hosting."],["It felt like extra work","Plan: do it together in five minutes."],["Her accountant","Plan: send the accountant two lines today."],["She doesn’t remember","Ask: “Was it more about trust, or about time?”"]]]],
"Evidence: all six areas covered, her own words noted, and you spoke less than she did."],

["11:00–12:00","One call or follow-up?","The ability to distinguish a simple, one-call opportunity from a deal that requires follow-up or additional stakeholders.",[
["say","“Let me check I understood. [Her pain, in her words]. It costs you about [hours] a week. You’re the one who decides, and your accountant just needs to be informed. Did I get that right?”"],
["if",[["She confirms, and her concerns are small","One-call deal: “I think we can solve this today. Let me focus on what matters to you, and then we can decide the next step together.”"],["She names another person, or a big concern","Follow-up deal: “Who else should see this? Let’s make that easy: I’ll send two lines they can read in a minute, and you and I speak again on [day].” Keep it light, no formal process."]]],
["note","Say the fork out loud. The evaluators need to hear you decide which kind of deal this is."]],
"Evidence: you named the fork out loud and chose a path. A small customer gets a light process, never an enterprise one."],

["12:00–15:00","Value proposition","A concise and relevant value proposition rather than a generic product tour.",[
["say","“You told me [her pain]. And you don’t want your accountant to have extra work. So here’s the short version.”"],
["say","“One: your banks, invoices and expenses live in one place, and every movement is reconciled automatically. You see your cash without updating Excel.”"],
["say","“Two: every invoice you issue is VeriFactu-compliant automatically, so you don’t have to think about it.”"],
["say","“Three: your accountant gets free access to the same data and keeps working in A3 or Sage through exports. Nothing changes for her.”"],
["ask","“Does that match what you need?”"],
["note","If she relies on Holded for CRM, projects or inventory, say: “Then I wouldn’t replace that. Pennylane would handle banks, cash and invoices.” Confirm that scope first."],
["note","Don’t tour the menus. If she agrees, show only the bank step."]],
"Evidence: three points, built from her words, each tied to her problem. No generic tour."],

["15:00–18:00","Concerns","Calm handling of concerns around migration, bank connectivity, the accountant’s role, compliance and price.",[
["note","Same pattern every time: acknowledge, answer with a fact, ask a check question. Slow down."],
["if",[
["Bank: “I’m not comfortable connecting my bank.”","“That’s fair, it’s your most sensitive data. Pennylane is ISO 27001 certified and hosts data in Europe. We can connect it together, and you’ll see exactly what is shared. Shall we try?” (Confirm access details and how to disconnect before you state them.)"],
["Migration: “I don’t want to move everything from Holded.”","“You don’t have to. We start with next month’s invoices, and history can follow. Does that feel manageable?” (Confirm what imports from Holded.)"],
["Accountant: “My accountant won’t like it.”","“She keeps A3 or Sage, gets free access and exports. Shall I send her two lines today so she isn’t surprised?”"],
["Compliance: “Is it VeriFactu compliant?”","“Yes, every invoice is compliant automatically. Is there anything else you’d like me to confirm in writing?”"],
["Price: “How much is it?” or “Holded is cheaper.”","“Let’s compare it with what today costs you. You said about [hours] a week. If that dropped by half, would the price make sense?” (Never quote Pennylane prices until you’ve confirmed the current plans.)"],
["“I need to think about it.”","“Of course. What would you want to be clearer on?” Solve that one doubt, then propose the date."]]]],
"Evidence: calm pace, you acknowledged first, answered with facts, and ended each answer with a question."],

["18:00–20:00","Next step","A concrete next step with ownership and timing. The next step should reduce friction, not create an enterprise-style process for a small customer.",[
["say","“Here’s what I suggest: let’s connect your bank right now, together. Five minutes, I’ll stay on the line and you stay in control.”"],
["if",[["She prefers not to do it now","“Then let’s keep it light. I’ll send your accountant two lines today, and you and I speak again on Thursday at 10:00. Does that work?”"],["She hesitates about the full switch","“Or we only start with next month’s invoices, and you decide after that.”"]]],
["say","“To confirm: I send [what] today. You [what] by [day]. We speak on [day, time]. Is anything missing?”"],
["note","One owner per action and a date within 48 hours. No long deck, no demo for other people, no formal approval. Send the written summary within the hour."]],
"Evidence: one owner for each action, one date within 48 hours, nothing heavier than the problem."]];
var sc="";C.forEach(function(c,i){sc+='<div class="card"><div><span class="tm">'+c[0]+'</span><b>'+c[1]+'</b></div><p class="mu" style="margin:6px 0">What they want to see: '+c[2]+'</p>';
c[3].forEach(function(s){var k=s[0];
if(k==="h")sc+='<div class="hd2">'+s[1]+'</div>';
else if(k==="say"||k==="ask")sc+='<p class="ln"><b>'+(k==="say"?"You say":"You ask")+'</b><span class="say">'+s[1]+'</span></p>';
else if(k==="lis")sc+='<p class="lis"><b>Listen for:</b> '+s[1]+'</p>';
else if(k==="if"){s[1].forEach(function(b){sc+='<div class="br"><div class="cue">If: '+b[0]+'</div><div class="rep">'+b[1]+'</div></div>'})}
else sc+='<div class="tip">'+s[1]+'</div>'});
sc+='<div class="tip" style="background:var(--ok2);border-color:var(--ok)">'+c[4]+'</div><label class="tg" style="font-size:15px;padding:10px 0 0;border:0"><input type="checkbox" data-c="'+i+'">I covered this</label></div>'});$("scr").innerHTML=sc;

function cn(){var n=document.querySelectorAll("[data-c]:checked").length;$("cnt").textContent=n+" of "+C.length+" covered"}
$("scr").addEventListener("change",cn);cn();
})();
</script></body></html>
